name: go
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go test ./... -race -cover
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
